<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who is online | MULTIVERSE MUD</title><meta name="description" content="Who is playing MULTIVERSE MUD right now, including linkdead players."><link rel="icon" href="data:,"><style>
:root{--bg:#0b0d12;--panel:#141922;--line:#263041;--text:#e8edf5;--dim:#94a0b4;--lamp:#ff9a3c;--good:#47d18c;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Iowan Old Style",Palatino,Georgia,serif}
.w{max-width:980px;margin:0 auto;padding:22px 16px 70px}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:26px;letter-spacing:.04em}h1 b{color:var(--lamp)}.sub{color:var(--dim);font-size:14px}.grow{flex:1}
a.btn{background:var(--lamp);color:#1a1208;text-decoration:none;padding:9px 16px;border-radius:10px;font-weight:700;font-family:system-ui,sans-serif}a.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
nav{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap}nav a{color:var(--dim);text-decoration:none;font-family:system-ui,sans-serif;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 14px}nav a.on{color:var(--lamp);border-color:var(--lamp)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}th{color:var(--dim);font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}td.n,th.n{text-align:right}
tr.g1 td{color:#ffd34a;font-weight:700}tbody tr:hover{background:#1a2130}.pill{display:inline-block;font:600 11px system-ui,sans-serif;padding:2px 9px;border-radius:999px;letter-spacing:.05em}.on{background:#123524;color:var(--good)}.ld{background:#3a2a10;color:#ffb13c}.bot{background:#1d2430;color:var(--dim)}
.stats{display:flex;gap:12px;margin:0 0 14px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px}.stat b{font-size:24px;display:block}.stat span{color:var(--dim);font:13px system-ui,sans-serif}
.empty{padding:26px;text-align:center;color:var(--dim)}.foot{color:var(--dim);font-size:13px;margin-top:14px}.al-good{color:#7ad7ff}.al-evil{color:#ff7a7a}.al-neutral{color:var(--dim)}@media(max-width:640px){th.h,td.h{display:none}}
</style></head><body><div class="w"><header><div class="grow"><h1>MULTIVERSE <b>MUD</b></h1><div class="sub">Who is playing right now</div></div><a class="btn" href="/">Play now</a><a class="btn ghost" href="/guide/">Player's Guide</a></header><nav><a href="/top.html">Top players</a><a href="/who.html" class="on">Who is online</a></nav>
<div class="stats"><div class="stat"><b id="n1">-</b><span>online now</span></div><div class="stat"><b id="n2">-</b><span>linkdead</span></div></div>
<div id="box"><div class="empty">Loading...</div></div>
<div class="foot">Linkdead players lost their connection and stay in the world for a few minutes in case they come back. Updates every few seconds.</div>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function go(){ try{ const r=await fetch('/api/pub/who',{cache:'no-store'}); const j=await r.json(); document.getElementById('n1').textContent=j.online; document.getElementById('n2').textContent=j.linkdead; const L=j.players;
  if(!L.length){ document.getElementById('box').innerHTML='<div class="empty">Nobody is online right now. <a style="color:var(--lamp)" href="/">Step into the multiverse.</a></div>'; return; }
  document.getElementById('box').innerHTML='<table><thead><tr><th>Player</th><th class="h">Class</th><th class="n">Level</th><th class="h">Alignment</th><th class="n h">On for</th><th>Status</th></tr></thead><tbody>'+L.map(p=>'<tr><td>'+esc(p.name)+(p.bot?' <span class="pill bot">resident bot</span>':'')+'</td><td class="h">'+esc(p.cls)+'</td><td class="n">'+(p.rm?'R'+p.rm+' ':'')+'L'+p.lv+'</td><td class="h al-'+p.align+'">'+esc(p.align[0].toUpperCase()+p.align.slice(1))+'</td><td class="n h">'+(p.mins<60?p.mins+' min':Math.floor(p.mins/60)+' h '+p.mins%60+' m')+'</td><td><span class="pill '+(p.status==='linkdead'?'ld':'on')+'">'+(p.status==='linkdead'?'linkdead':'online')+'</span></td></tr>').join('')+'</tbody></table>'; }catch(e){ document.getElementById('box').innerHTML='<div class="empty">The game server is not reachable right now.</div>'; } }
go(); setInterval(go,10000);
</script></div></body></html>
